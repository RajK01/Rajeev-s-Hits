<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajeev's Favorite Hits 🎵</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #0a0a0f;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(120,40,200,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(220,100,20,0.2) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 56px 20px 32px;
  }

  header .icon { font-size: 3rem; animation: pulse 2s ease-in-out infinite; }

  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }

  header h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(135deg, #f5a623, #e040fb, #29b6f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 12px 0 6px;
    letter-spacing: -1px;
  }

  header p { color: rgba(255,255,255,0.5); font-size: 1rem; }

  .badge {
    display: inline-block;
    margin-top: 14px;
    padding: 5px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 0.8rem;
    color: rgba(255,255,255,0.6);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }

  .card {
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border-color: rgba(255,255,255,0.25);
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #111;
    overflow: hidden;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s, filter 0.4s;
    filter: brightness(0.75);
  }

  .card:hover .thumb-wrap img {
    transform: scale(1.05);
    filter: brightness(0.9);
  }

  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255, 0, 0, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s, background 0.25s;
    box-shadow: 0 4px 20px rgba(255,0,0,0.5);
  }

  .card:hover .play-btn {
    transform: translate(-50%, -50%) scale(1.15);
    background: #ff0000;
  }

  .play-btn svg { width: 26px; height: 26px; fill: #fff; margin-left: 4px; }

  .num-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
  }

  .card-body {
    padding: 14px 16px 16px;
  }

  .card-body h2 {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.4;
    color: #fff;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-body .artist {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.45);
  }

  /* iframe overlay */
  .thumb-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 2;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

<header>
  <div class="icon">🎵</div>
  <h1>Rajeev's Favorite Hits</h1>
  <p>A personal collection of songs &amp; videos</p>
  <span class="badge">▶ Click any card to play</span>
</header>

<main id="grid"></main>

<footer>Made with ♥ — Rajeev Kumar</footer>

<script>
const songs = [
  {
    num: 1,
    title: "Hall of Fame",
    artist: "The Script ft. Will.i.am",
    id: "OhrXtqnId_o"
  },
  {
    num: 2,
    title: "On the Floor",
    artist: "Jennifer Lopez ft. Pitbull",
    id: "t4H_Zoh7G5A"
  },
  {
    num: 3,
    title: "Give Me Freedom, Give Me Fire",
    artist: "K'naan — FIFA World Cup 2010",
    id: "Y1bukaetjJI"
  },
  {
    num: 4,
    title: "Unexpected Love Story ❤️",
    artist: "Short Film Edit",
    id: "iCjV-nXaQ4o"
  },
  {
    num: 5,
    title: "Sajna Ke Sajde Mein Itna — Deewaana Deewaana",
    artist: "A.R. Rahman • Tere Ishq Mein",
    id: "jko0dgGUwic"
  },
  {
    num: 6,
    title: "Tamma Tamma Loge (4K)",
    artist: "Bappi Lahiri • Thanedaar",
    id: "Xs5k7d6kzh8"
  },
  {
    num: 7,
    title: "Dai Dai",
    artist: "Shakira ft. Burna Boy — FIFA World Cup 2026",
    id: "fcnDmrtj6Sk"
  },
  {
    num: 8,
    title: "Magic in the Air",
    artist: "Magic System ft. Chawki",
    id: "BAkqJT_sMKQ"
  },
  {
    num: 9,
    title: "I AM — Affirmations for Abundance, Success & Personal Power",
    artist: "VYBO — Morning Affirmations",
    id: "S2lbRo28GoI"
  },
  {
    num: 10,
    title: "Luxury Lifestyle of Billionaires",
    artist: "The Most Expensive Things Money Can Buy",
    id: "js-XOXyqLFI"
  },
  {
    num: 11,
    title: "Billionaire Luxury Lifestyle 2026",
    artist: "Billionaire Motivation & Visualization",
    id: "1MbrPhTz4rE"
  },
  {
    num: 12,
    title: "The 48 Laws of Power — Full Audiobook",
    artist: "Robert Greene",
    id: "2P1-SunHlZg"
  },
  {
    num: 13,
    title: "Build Main Character Energy & Magnetic Aura ✨",
    artist: "Mindset & Aura",
    id: "l3zV7BbpNQo"
  }
];

const grid = document.getElementById('grid');

songs.forEach(s => {
  const thumb = `https://img.youtube.com/vi/${s.id}/hqdefault.jpg`;
  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = `
    <div class="thumb-wrap" id="wrap-${s.id}">
      <img src="${thumb}" alt="${s.title}" loading="lazy">
      <div class="play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="num-badge">${s.num}</div>
    </div>
    <div class="card-body">
      <h2>${s.title}</h2>
      <p class="artist">${s.artist}</p>
    </div>
  `;

  card.querySelector('.thumb-wrap').addEventListener('click', function () {
    const wrap = document.getElementById('wrap-' + s.id);
    if (wrap.querySelector('iframe')) return;
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${s.id}?autoplay=1&rel=0`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    wrap.appendChild(iframe);
  });

  grid.appendChild(card);
});
</script>
</body>
</html>
