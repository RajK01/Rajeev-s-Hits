*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{font-family:'Poppins',sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;overflow-x:hidden}

header{position:relative;z-index:1;text-align:center;padding:48px 20px 20px}
header .icon{font-size:3rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
header h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900;background:linear-gradient(135deg,#f5a623,#e040fb,#29b6f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:10px 0 4px;letter-spacing:-1px}
header p{color:rgba(255,255,255,.45);font-size:.95rem}
#total-count{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:.8rem;color:rgba(255,255,255,.55)}

/* CONTROLS */
.controls{position:relative;z-index:1;max-width:1280px;margin:18px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
#search-wrap{flex:1;min-width:220px;position:relative}
#search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
#search{width:100%;padding:11px 16px 11px 42px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:.9rem;outline:none;transition:border-color .2s,background .2s}
#search::placeholder{color:rgba(255,255,255,.3)}
#search:focus{border-color:rgba(240,100,200,.5);background:rgba(255,255,255,.1)}
#surprise-btn{padding:11px 20px;border-radius:12px;border:none;background:linear-gradient(135deg,#f5a623,#e040fb);color:#fff;font-family:inherit;font-weight:700;font-size:.88rem;cursor:pointer;transition:transform .2s,box-shadow .2s;white-space:nowrap}
#surprise-btn:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(224,64,251,.4)}

/* CATEGORY TABS */
.tabs-wrap{position:relative;z-index:1;max-width:1280px;margin:14px auto 0;padding:0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:8px;width:max-content}
.tab{padding:8px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.55);font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab.active{background:linear-gradient(135deg,#7c3aed,#db2777);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.4)}

/* GRID */
main{position:relative;z-index:1;max-width:1280px;margin:18px auto 80px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}

/* NO RESULTS */
#no-results{display:none;grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);font-size:1.1rem}

/* CARD */
.card{border-radius:16px;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:transform .25s,box-shadow .25s,border-color .25s;position:relative;animation:fadeIn .35s ease both}

.card.hidden{display:none}

.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#111;overflow:hidden;cursor:pointer}

.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:rgba(255,0,0,.85);display:flex;align-items:center;justify-content:center;transition:transform .25s,background .25s;box-shadow:0 4px 20px rgba(255,0,0,.5);pointer-events:none}
.card:hover .play-btn{transform:translate(-50%,-50%) scale(1.15);background:#ff0000}
.play-btn svg{width:24px;height:24px;fill:#fff;margin-left:4px}
.thumb-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;z-index:2}
.num-badge{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}

.heart-btn:hover{transform:scale(1.2);background:rgba(0,0,0,.8)}
.heart-btn.loved{filter:drop-shadow(0 0 6px #ff4d6d)}

.card-body{padding:12px 14px 14px;position:relative}
.card-body h2{font-size:.9rem;font-weight:600;line-height:1.4;color:#fff;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

#scroll-top{position:fixed;bottom:28px;right:28px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#db2777);border:none;color:#fff;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(124,58,237,.5);opacity:0;transform:scale(0);transition:opacity .3s,transform .3s;z-index:100}
#scroll-top.visible{opacity:1;transform:scale(1)}

footer{position:relative;z-index:1;text-align:center;padding:16px;font-size:.72rem;color:rgba(255,255,255,.18)}

  const isIG  = s.type === 'instagram';
  const wrapId = 'wrap-' + s.num;
  const [tagBg, tagFg] = CAT_COLORS[s.cat] || ['#444','#fff'];
  const isFav = favs.includes(s.num);

  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.num = s.num;
  card.dataset.cat = s.cat;

  card.innerHTML = `
    <div class="thumb-wrap" id="${wrapId}">
      ${isIG ? igThumb() : `<img src="https://img.youtube.com/vi/${s.id}/hqdefault.jpg" alt="${s.title}" loading="lazy">`}
      <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="num-badge">${s.num}</div>
    </div>
    <button class="heart-btn${isFav?' loved':''}" data-num="${s.num}" title="Favourite">${isFav?'❤️':'🤍'}</button>
    <div class="card-body">
      <h2>${s.title}</h2>
      <p class="artist">${s.artist}</p>
      <span class="cat-tag" style="background:${tagBg}20;color:${tagBg};border:1px solid ${tagBg}40">${CAT_LABELS[s.cat]||s.cat}</span>
    </div>`;

  /* Play */
  card.querySelector('.thumb-wrap').addEventListener('click', () => {
    if(isIG){ window.open(`https://www.instagram.com/reel/${s.id}/`,'_blank'); return; }
    const wrap = document.getElementById(wrapId);
    if(wrap.querySelector('iframe')) return;
    /* stop previous */
    if(nowPlaying && nowPlaying !== card){
      const prev = nowPlaying.querySelector('iframe');
      if(prev) prev.remove();
      const prevLabel = nowPlaying.querySelector('.now-playing-label');
      if(prevLabel) prevLabel.remove();
      nowPlaying.classList.remove('playing');
    }
    nowPlaying = card;
    card.classList.add('playing');
    const lbl = document.createElement('div');
    lbl.className = 'now-playing-label';
    lbl.textContent = '▶ Now Playing';
    wrap.appendChild(lbl);
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${s.id}?autoplay=1&rel=0`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    wrap.appendChild(iframe);
  });

  /* Heart */
  card.querySelector('.heart-btn').addEventListener('click', e => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const n = parseInt(btn.dataset.num);
    if(favs.includes(n)){
      favs = favs.filter(x => x !== n);
      btn.textContent = '🤍'; btn.classList.remove('loved');
    } else {
      favs.push(n);
      btn.textContent = '❤️'; btn.classList.add('loved');
    }
    saveFavs();
    if(activeCat === 'fav') applyFilter();
  });

  cardEls[s.num] = card;
  grid.appendChild(card);
});

/* ── Filter / Search ── */
function applyFilter(){
  let visible = 0;
  songs.forEach(s => {
    const show = isVisible(s);
    cardEls[s.num].classList.toggle('hidden', !show);
    if(show) visible++;
  });
  noResults.style.display = visible === 0 ? 'block' : 'none';
  countEl.textContent = visible === songs.length ? `${songs.length} videos` : `${visible} of ${songs.length}`;
  footerEl.textContent = `${visible} video${visible!==1?'s':''} showing`;
}

/* ── Tabs ── */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCat = tab.dataset.cat;
    applyFilter();
  });
});

/* ── Search ── */
searchEl.addEventListener('input', e => {
  searchQ = e.target.value.trim();
  applyFilter();
});

/* ── Surprise Me ── */
document.getElementById('surprise-btn').addEventListener('click', () => {
  const visible = songs.filter(isVisible);
  if(!visible.length) return;
  const s = visible[Math.floor(Math.random() * visible.length)];
  const card = cardEls[s.num];
  card.scrollIntoView({behavior:'smooth', block:'center'});
  setTimeout(() => card.querySelector('.thumb-wrap').click(), 600);
});

/* ── Scroll to Top ── */
window.addEventListener('scroll', () => {
  scrollBtn.classList.toggle('visible', window.scrollY > 300);
});
scrollBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

/* ── Init ── */
footerEl.textContent = `${songs.length} videos showing`;
applyFilter();
</script>
</body>
</html>
